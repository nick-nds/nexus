name: laravel-ddd-cqrs
display_name: Laravel DDD with CQRS
description: |
  Domain-Driven Design with CQRS command/query handler separation on
  top of the standard DDD module layout. Detects command handlers,
  query handlers, commands, and queries via naming suffixes.

  Command/query bus dispatches (``$bus->ask(new FooQuery())`` etc.) are
  traced to their handler automatically: the extractor emits a
  ``bus_dispatch`` finding and the graph builder synthesises a
  ``CALLS`` edge (``via=bus_convention``) from the dispatch site to the
  handler's ``handle``/``__invoke`` method, so ``find_callers`` answers
  "who dispatches this command/query?" without an LSP. Resolution is by
  short name (``FooQuery`` → ``FooQueryHandler``); no configuration is
  required.

detection:
  signals:
    - kind: path_exists
      path: app/Modules/*/Domain
      weight: 40
    - kind: path_exists
      path: app/Modules/*/Application/CommandHandlers
      weight: 25
    - kind: path_exists
      path: app/Modules/*/Application/QueryHandlers
      weight: 15
    - kind: class_suffix_frequency
      suffix: Handler
      threshold: 5
      weight: 10
    - kind: class_suffix_frequency
      suffix: Command
      threshold: 5
      weight: 10

conventions:
  custom_bases: {}
  custom_suffixes:
    Handler: command_handler
    QueryHandler: query_handler
    Command: command
    Query: query
  modules:
    pattern: "app/Modules/{module}/**"
    layers: [Domain, Application, Infrastructure, Presentation]
