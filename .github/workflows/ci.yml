name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: ruff format check
        run: uv run ruff format --check nexus/ tests/

      - name: ruff lint
        run: uv run ruff check nexus/ tests/

      - name: mypy strict
        run: uv run mypy --strict nexus/

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      # The LSP integration tests under ``tests/integration/test_lsp_client.py``
      # skip when no LSP binary is on PATH. Without intelephense we lose
      # ~25 lines of coverage in nexus/adapters/lsp/lsp_client.py — enough
      # to drop the project under the 90% gate. Installing it costs ~5s.
      - name: Set up Node.js (for intelephense)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install intelephense
        run: npm install -g intelephense

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests with coverage
        run: |
          uv run pytest \
            --cov=nexus \
            --cov-report=term-missing \
            --cov-fail-under=90 \
            -q
