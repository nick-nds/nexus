name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Opt JS-based actions onto Node 24 ahead of the 2026-06-16 forced migration
# (silences the Node 20 deprecation warnings).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: ruff format check
        run: uv run ruff format --check nexus/ tests/

      - name: ruff lint
        run: uv run ruff check nexus/ tests/

      - name: mypy strict
        run: uv run mypy --strict nexus/

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      # The LSP integration tests under ``tests/integration/test_lsp_client.py``
      # skip when no LSP binary is on PATH. Without intelephense we lose
      # ~25 lines of coverage in nexus/adapters/lsp/lsp_client.py - enough
      # to drop the project under the 90% gate. Installing it costs ~5s.
      - name: Set up Node.js (for intelephense)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install intelephense
        run: npm install -g intelephense

      # Ubuntu GitHub runners ship with Composer pre-installed; macOS
      # runners don't. Without it the ``_check_composer`` path in
      # ``nexus/interfaces/cli/commands/doctor.py`` returns early on
      # macOS, leaving ~2 lines uncovered and dropping the project
      # below the 90% gate. Brew adds it in a few seconds.
      - name: Install Composer (macOS only)
        if: runner.os == 'macOS'
        run: brew install composer

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests with coverage
        run: |
          uv run pytest \
            --cov=nexus \
            --cov-report=term-missing \
            --cov-fail-under=90 \
            -q

      - name: Run package integration tests
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        env:
          RUN_PACKAGE_INTEGRATION: "1"
        run: uv run pytest tests/integration/package/ -v

  smoke:
    # Phase 5 test strategy calls for an end-to-end smoke test exercising
    # the full ``pip install`` → ``nexus init`` → query path. The "full"
    # version drives ``nexus index rebuild`` against a sample Laravel app
    # - but that fixture (``tests/fixtures/sample-laravel-app/``) doesn't
    # exist yet, so this is the **lite** variant: it exercises the CLI
    # surface and the Python ingestion path (via a known reflection.json
    # from ``tests/fixtures/reflection-samples/``), skipping the PHP
    # extractor. Catches CLI plumbing regressions before they reach
    # users.
    name: Smoke (CLI surface + reflection ingestion)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      # Doctor's LSP probe expects intelephense on PATH; without it the
      # ``lsp`` check reports a warning, which the smoke script accepts
      # (it tolerates exit 1 = "checks failed but command succeeded").
      # Installing it just keeps the smoke output cleaner and matches
      # the test job's behavior.
      - name: Set up Node.js (for intelephense)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install intelephense
        run: npm install -g intelephense

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run smoke check
        run: uv run python scripts/smoke_check.py
