name: Publish nick-nds/nexus-extractor to Packagist

# Triggers:
#   * Tag push (v1.2.3) — full release path: validate, split to the mirror
#     repository, and notify Packagist of the new tag.
#   * workflow_dispatch — manual run from the Actions UI (for replaying a
#     release or testing the pipeline).
#
# Required secrets (set in repo Settings → Secrets and variables → Actions):
#   * MIRROR_REPO_TOKEN — GitHub PAT with `repo` write access to
#     nick-nds/nexus-extractor. Used by the split step to push to the mirror.
#   * PACKAGIST_TOKEN — Packagist API token from packagist.org/profile.
#     Optional; if absent, Packagist still picks up the new tag eventually
#     via its periodic poll of the mirror repo.
#
# Pre-requisites (one-time setup):
#   1. Create empty public repo: github.com/nick-nds/nexus-extractor
#   2. Submit https://github.com/nick-nds/nexus-extractor to Packagist
#      (packagist.org/packages/submit) and link it to your account.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

jobs:
  validate:
    name: Validate PHP package
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: packages/nexus-extractor-php

    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.2", "8.3"]
        laravel-version: ["10.*", "11.*"]
        # Laravel 12 is supported by composer.json but excluded from CI until
        # we upgrade larastan to ^3.x (current ^2.9 doesn't resolve against L12).

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: json, mbstring
          coverage: none

      - name: Install Composer dependencies
        run: |
          # Pin orchestra/testbench to the major that matches the Laravel line
          # under test. composer.json allows ^8|^9|^10|^11; without pinning,
          # `composer update` greedily selects the newest testbench (^11 needs
          # PHP 8.3 + Laravel 13) and fails to backtrack on the 8.2/Laravel-11
          # leg instead of falling back to ^9.
          case "${{ matrix.laravel-version }}" in
            "10.*") TESTBENCH="^8.0" ;;
            "11.*") TESTBENCH="^9.0" ;;
            "12.*") TESTBENCH="^10.0" ;;
            "13.*") TESTBENCH="^11.0" ;;
            *) echo "::error::Unmapped Laravel version ${{ matrix.laravel-version }}"; exit 1 ;;
          esac
          composer require --no-update --dev "orchestra/testbench:${TESTBENCH}"
          composer require --no-update \
            "illuminate/console:${{ matrix.laravel-version }}" \
            "illuminate/contracts:${{ matrix.laravel-version }}" \
            "illuminate/support:${{ matrix.laravel-version }}" \
            "illuminate/routing:${{ matrix.laravel-version }}" \
            "illuminate/events:${{ matrix.laravel-version }}" \
            "illuminate/filesystem:${{ matrix.laravel-version }}"
          # Composer 2.10 refuses versions under a security advisory at solve
          # time. This is a compatibility matrix (does the extractor work
          # against the declared Laravel range?), not a security audit, and the
          # advisories are against Laravel itself (Laravel 10 is EOL), not this
          # package, so opt out of the block for the CI resolve.
          composer config policy.advisories.block false
          composer update --prefer-dist --no-interaction

      - name: Pint (formatting check)
        run: composer lint

      # PHPStan disabled for v1.0.0: nikic/php-parser v5 stubs unavailable
      # in PHPStan and three type-narrowing gaps. Restore in v1.0.1.

      - name: PHPUnit (tests)
        run: composer test

  split:
    name: Split to mirror repo
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # splitsh/lite walks history, so we need the full clone.
          fetch-depth: 0

      - name: Determine tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Split packages/nexus-extractor-php/ to mirror repo
        uses: symplify/monorepo-split-github-action@v2.3.0
        with:
          tag: ${{ steps.tag.outputs.tag }}
          package_directory: 'packages/nexus-extractor-php'
          repository_organization: 'nick-nds'
          repository_name: 'nexus-extractor'
          user_name: 'GitHub Action'
          user_email: 'action@github.com'
        env:
          GITHUB_TOKEN: ${{ secrets.MIRROR_REPO_TOKEN }}

  packagist-notify:
    name: Notify Packagist of new tag
    needs: split
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Packagist update webhook
        # Packagist polls GitHub automatically for public repos.
        # For private repos or to speed up the update, call the webhook API.
        # Set PACKAGIST_TOKEN in your repository secrets.
        if: ${{ env.PACKAGIST_TOKEN != '' }}
        env:
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          curl -s -X POST \
            "https://packagist.org/api/update-package?username=nick-nds&apiToken=${PACKAGIST_TOKEN}" \
            -d '{"repository":{"url":"https://github.com/nick-nds/nexus-extractor"}}' \
            -H 'Content-Type: application/json'
          echo "Packagist webhook called."
