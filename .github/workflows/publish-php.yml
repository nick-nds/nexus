name: Publish nexus/extractor-php to Packagist

# DISABLED: triggers manually only (workflow_dispatch).
#
# This workflow is the documented release path for the Composer
# package but stays dormant until the project is ready to publish.
# Re-enable by reverting the ``on:`` block to:
#
#   on:
#     push:
#       tags:
#         - "v[0-9]+.[0-9]+.[0-9]+"
#
# Manual run from GitHub UI: Actions → Publish nexus/extractor-php → Run workflow.
# Packagist also polls GitHub automatically once the repo is linked.
on:
  workflow_dispatch:

defaults:
  run:
    working-directory: packages/nexus-extractor-php

jobs:
  validate:
    name: Validate PHP package
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version: ["8.2", "8.3"]
        laravel-version: ["10.*", "11.*", "12.*"]
        exclude:
          # Laravel 12 requires PHP 8.2+; already covered — no extra excludes needed.
          - php-version: "8.2"
            laravel-version: "12.*"

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: json, mbstring
          coverage: none

      - name: Install Composer dependencies
        run: |
          composer require "illuminate/console:${{ matrix.laravel-version }}" \
                           "illuminate/contracts:${{ matrix.laravel-version }}" \
                           "illuminate/support:${{ matrix.laravel-version }}" \
                           "illuminate/routing:${{ matrix.laravel-version }}" \
                           "illuminate/events:${{ matrix.laravel-version }}" \
                           "illuminate/filesystem:${{ matrix.laravel-version }}" \
            --no-update
          composer update --prefer-dist --no-interaction

      - name: Pint (formatting check)
        run: composer lint

      - name: PHPStan (static analysis)
        run: composer stan

      - name: PHPUnit (tests)
        run: composer test

  packagist-notify:
    name: Notify Packagist of new tag
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Packagist update webhook
        # Packagist polls GitHub automatically for public repos.
        # For private repos or to speed up the update, call the webhook API.
        # Set PACKAGIST_TOKEN in your repository secrets.
        if: ${{ env.PACKAGIST_TOKEN != '' }}
        env:
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          curl -s -X POST \
            "https://packagist.org/api/update-package?username=nexus&apiToken=${PACKAGIST_TOKEN}" \
            -d '{"repository":{"url":"https://github.com/${{ github.repository }}"}}' \
            -H 'Content-Type: application/json'
          echo "Packagist webhook called."
